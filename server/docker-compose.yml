# MiniCrafter online edition on one server: relay + accounts + database.
# Nothing has a public port; the site's reverse proxy sends /rooms and /api here by name.
# Settings come from a .env file next to this one (never commit it):
#   ALLOWED_ORIGINS=https://your-site.example
#   POSTGRES_PASSWORD=<long random password>
services:
  minicrafter-rooms:
    build: .
    container_name: minicrafter-rooms
    restart: unless-stopped
    command: ["node", "rooms.mjs"]
    environment:
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?set ALLOWED_ORIGINS in .env}
      AUTH_URL: http://minicrafter-accounts:8788   # Play Together needs a login
    networks: [minicrafter_net]
    read_only: true
    mem_limit: 128m
    depends_on: [minicrafter-accounts]

  minicrafter-accounts:
    build: .
    container_name: minicrafter-accounts
    restart: unless-stopped
    command: ["node", "accounts.mjs"]
    environment:
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?set ALLOWED_ORIGINS in .env}
      DATABASE_URL: postgres://minicrafter:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@minicrafter-db:5432/minicrafter
    networks: [minicrafter_net]
    read_only: true
    mem_limit: 256m
    depends_on: [minicrafter-db]

  minicrafter-db:
    image: postgres:16-alpine
    container_name: minicrafter-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: minicrafter
      POSTGRES_USER: minicrafter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [minicrafter_db:/var/lib/postgresql/data]
    networks: [minicrafter_net]
    mem_limit: 256m

volumes:
  minicrafter_db:

networks:
  minicrafter_net:
    name: minicrafter_net
